<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý bánh ngọt</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="falling"></div>
  <div class="topbar">
    <div class="top-inner">
      <div class="brand">
        <div class="logo">🍰</div>
        <h1>Quản Lý Bánh Ngọt</h1>
      </div>
      <div class="actions">
        <input type="text" id="search" placeholder="Tìm kiếm bánh...">
        <select id="categoryFilter"></select>
        <select id="perPage">
          <option value="6">6 / trang</option>
          <option value="12" selected>12 / trang</option>
          <option value="24">24 / trang</option>
        </select>
        <button class="btn ghost" id="btnMyCakes">Bánh của tôi 🍩</button>
        <button class="btn primary" id="btnNew">+ Thêm bánh</button>
        <button class="btn ghost" id="btnLogout">Đăng xuất</button>
      </div>
    </div>
  </div>

  <main class="container">
    <div id="alert" class="alert" hidden></div>
    <div class="panel">
      <div class="panel-head">
        <h2>Danh sách bánh</h2>
        <div class="muted" id="stats"></div>
      </div>
      <div id="grid" class="grid"></div>
      <div class="pager">
        <button id="prev" class="btn small ghost">← Trước</button>
        <span id="pageInfo"></span>
        <button id="next" class="btn small ghost">Sau →</button>
      </div>
    </div>
  </main>

  <!-- Template card -->
  <template id="cardTpl">
    <div class="card">
      <div class="card-media"><img class="thumb" src="" alt="cake"></div>
      <div class="card-body">
        <h3 class="title"></h3>
        <div class="meta">
          <span class="cat"></span>
          <span class="price"></span>
        </div>
        <p class="desc"></p>
      </div>
      <div class="card-actions">
        <button class="btn small edit">Sửa</button>
        <button class="btn small delete">Xóa</button>
      </div>
    </div>
  </template>

  <!-- Modal -->
  <div id="modal" class="modal" aria-hidden="true">
    <div class="dialog">
      <div class="dialog-head">
        <h2 id="modalTitle">Tạo bánh mới</h2>
        <button id="closeModal" class="close">✕</button>
      </div>
      <form id="form" class="dialog-body">
        <input type="hidden" id="cakeId">
        <label>Tên bánh</label>
        <input type="text" id="name" required>
        <label>Link ảnh (URL)</label>
        <input type="text" id="image" placeholder="https://...">
        <div class="row">
          <div style="flex:1">
            <label>Giá (VNĐ)</label>
            <input type="number" id="price">
          </div>
          <div style="flex:1">
            <label>Số lượng</label>
            <input type="number" id="stock">
          </div>
        </div>
        <label>Danh mục</label>
        <input type="text" id="category" placeholder="Bánh kem, Bánh Tết...">
        <label>Mô tả</label>
        <textarea id="description" rows="3"></textarea>
        <div class="form-actions">
          <button type="submit" class="btn">Lưu</button>
          <button type="button" class="btn" id="cancel">Hủy</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
